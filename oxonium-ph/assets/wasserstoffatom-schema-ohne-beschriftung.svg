<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Unbeschriftetes schematisches Modell eines Wasserstoffatoms</title>
  <desc id="desc">In der Mitte befindet sich ein Proton. Ein Elektron befindet sich in der schematisch dargestellten Elektronenschale.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef8fa"/>
    </radialGradient>
    <radialGradient id="protonFill" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff8a68"/>
      <stop offset="1" stop-color="#e45235"/>
    </radialGradient>
    <radialGradient id="electronFill" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#35b8d2"/>
      <stop offset="1" stop-color="#08728e"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b3040" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="38" fill="url(#background)"/>

  <!-- Elektronenschale / schematische Aufenthaltsregion -->
  <circle cx="600" cy="400" r="285" fill="#dff4f7" fill-opacity="0.48" stroke="#1688a1" stroke-width="6" stroke-dasharray="17 15"/>
  <circle cx="600" cy="400" r="252" fill="none" stroke="#2ec4b6" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Proton im Kern -->
  <circle cx="600" cy="400" r="88" fill="url(#protonFill)" stroke="#a83c28" stroke-width="6" filter="url(#softShadow)"/>

  <!-- Elektron in der Schale -->
  <circle cx="820" cy="218" r="57" fill="url(#electronFill)" stroke="#07536a" stroke-width="6" filter="url(#softShadow)"/>
</svg>
